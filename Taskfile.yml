version: '3'

# Commands run through Task's built-in POSIX shell on every OS, so `cd`, `&&`
# and quoting behave the same on Windows, macOS and Linux.

vars:
  ROOT: '{{toSlash .ROOT_DIR}}'
  TOOLS_BIN: '{{.ROOT}}/.tools/bin'
  BUF: '{{.TOOLS_BIN}}/buf{{exeExt}}'
  GOLANGCI_LINT: '{{.TOOLS_BIN}}/golangci-lint{{exeExt}}'
  SQLC: '{{.TOOLS_BIN}}/sqlc{{exeExt}}'
  GOOSE: '{{.TOOLS_BIN}}/goose{{exeExt}}'
  MIGRATIONS_DIR: hub/internal/adapter/sqlite/migrations
  DEV_SETUP_TOKEN: dev-setup-token
  HUB_BIN: '{{.ROOT}}/bin/hub{{exeExt}}'
  DEV_DIR: '{{.ROOT}}/.dev'
  GO_MODULES: hub tools
  GEN_DIRS: hub/gen packages/contracts/src/gen

tasks:
  default:
    cmds:
      - task --list
    silent: true

  setup:
    desc: Install pinned tools and JS dependencies
    cmds:
      - task: tools
      - pnpm install --frozen-lockfile

  tools:
    desc: 'Install pinned dev tools into .tools/bin (all, or the ones given: task tools -- buf)'
    cmds:
      - go -C tools run ./cmd/fetchtools -manifest "{{.ROOT}}/tools/manifest.json" -bin "{{.TOOLS_BIN}}" {{.CLI_ARGS}}

  gen:
    desc: Generate protobuf code (Go + TS) and sqlc queries
    cmds:
      - cd proto && "{{.BUF}}" generate
      - cd hub && "{{.SQLC}}" generate

  gen:check:
    desc: Fail if generated code differs from what the generators produce now
    cmds:
      - >-
        go -C tools run ./cmd/gencheck -root "{{.ROOT}}" -dir proto
        {{range $d := splitList " " .GEN_DIRS}}-path {{$d}} {{end}}
        -- "{{.BUF}}" generate --output "{out}"
      - cd hub && "{{.SQLC}}" diff

  db:migration:
    desc: 'Create a SQL migration (task db:migration -- add_guilds)'
    cmds:
      - '"{{.GOOSE}}" -dir "{{.ROOT}}/{{.MIGRATIONS_DIR}}" -s create {{.CLI_ARGS}} sql'

  dev:
    desc: 'Run the hub and the Vite dev server (first run: http://localhost:5173/setup?token=dev-setup-token)'
    deps: [dev:hub, dev:web]

  dev:hub:
    desc: Run the hub and its LiveKit sidecar against a throwaway data dir in .dev/, logging emails instead of sending them
    cmds:
      - go -C hub build -o "{{.DEV_DIR}}/hub{{exeExt}}" ./cmd/hub
      - >-
        "{{.DEV_DIR}}/hub{{exeExt}}" run --data-dir "{{.DEV_DIR}}/data" --log-level debug
        --mail-dev-log=true --setup-token {{.DEV_SETUP_TOKEN}}
        --livekit-binary "{{.TOOLS_BIN}}/livekit-server{{exeExt}}" --livekit-external-ip=false

  dev:web:
    desc: Run the Vite dev server, proxying API routes to the hub
    cmds:
      - pnpm --filter @dislackso/web dev

  lint:
    desc: Lint Go, protobuf and TypeScript, and check formatting
    cmds:
      - task: lint:go
      - task: lint:proto
      - task: lint:web

  lint:go:
    cmds:
      - for: { var: GO_MODULES, split: ' ' }
        cmd: cd {{.ITEM}} && "{{.GOLANGCI_LINT}}" run ./...

  lint:proto:
    dir: proto
    cmds:
      - '"{{.BUF}}" lint'
      - '"{{.BUF}}" format --diff --exit-code'

  lint:web:
    cmds:
      - pnpm lint
      - pnpm format:check

  fmt:
    desc: Format Go, protobuf and TypeScript sources
    cmds:
      - for: { var: GO_MODULES, split: ' ' }
        cmd: cd {{.ITEM}} && "{{.GOLANGCI_LINT}}" fmt ./...
      - cd proto && "{{.BUF}}" format -w
      - pnpm format

  typecheck:
    desc: Typecheck every TypeScript package
    cmds:
      - pnpm typecheck

  test:
    desc: Run Go and TypeScript unit tests
    cmds:
      - task: test:go
      - task: test:web

  test:go:
    cmds:
      - for: { var: GO_MODULES, split: ' ' }
        cmd: cd {{.ITEM}} && go test ./...

  test:web:
    cmds:
      - pnpm test

  test:int:
    desc: Go integration tests (build tag "integration", real livekit-server)
    dir: hub
    cmds:
      - go test -tags integration ./...

  check:
    desc: Lint, typecheck, unit tests and generated-code freshness
    cmds:
      - task: lint
      - task: typecheck
      - task: test
      - task: gen:check

  build:
    desc: Build the web client and embed it into a single hub binary at bin/, with livekit-server next to it, and the desktop app
    cmds:
      - task: build:web
      - task: build:hub
      - task: build:desktop

  build:desktop:
    cmds:
      - pnpm --filter @dislackso/desktop build

  desktop:
    desc: Build and open the desktop app; it asks for the server's address the first time
    cmds:
      - task: build:desktop
      - pnpm --filter @dislackso/desktop start

  desktop:dist:
    desc: 'Build the desktop installer for this OS into apps/desktop/dist/ (VERSION=0.6.0 to set its version)'
    vars:
      DESCRIBED:
        sh: git describe --tags --always --dirty --match "v*" 2>/dev/null | sed 's/^v//'
      VERSION: '{{.VERSION | default .DESCRIBED}}'
    cmds:
      - task: build:desktop
      - pnpm --filter @dislackso/desktop exec electron-builder --publish never --config.extraMetadata.version={{.VERSION}}

  build:web:
    cmds:
      - pnpm --filter @dislackso/web build

  build:hub:
    vars:
      LIVEKIT_SRC: '{{.TOOLS_BIN}}/livekit-server{{exeExt}}'
      LIVEKIT_STAMP: '{{.TOOLS_BIN}}/.stamps/livekit-server'
      VERSION:
        sh: git describe --tags --always --dirty --match "v*" 2>/dev/null || echo dev
    cmds:
      - >-
        go -C hub build -trimpath
        -ldflags "-s -w -X github.com/tornellihenrique/dislackso-rebirth/hub/internal/buildinfo.version={{.VERSION}}"
        -o "{{.HUB_BIN}}" ./cmd/hub
      # The hub looks for livekit-server next to itself, so bin/hub then has
      # voice when started by double-click. Copied only when the pinned
      # version changes: a running copy cannot be overwritten on Windows.
      - >-
        if [ -f "{{.LIVEKIT_SRC}}" ] && [ "$(cat "{{.LIVEKIT_STAMP}}")" != "$(cat "{{.ROOT}}/bin/.livekit-server" 2>/dev/null)" ]; then
        cp "{{.LIVEKIT_SRC}}" "{{.ROOT}}/bin/livekit-server{{exeExt}}" && cp "{{.LIVEKIT_STAMP}}" "{{.ROOT}}/bin/.livekit-server";
        fi

  release:archive:
    desc: 'Package the hub and livekit-server for one platform into dist/ (task release:archive GOOS=windows GOARCH=amd64)'
    vars:
      GOOS: '{{.GOOS | default OS}}'
      GOARCH: '{{.GOARCH | default ARCH}}'
      VERSION:
        sh: git describe --tags --always --dirty --match "v*" 2>/dev/null || echo dev
      EXE: '{{if eq .GOOS "windows"}}.exe{{end}}'
      NAME: 'dislackso-hub-{{.VERSION}}-{{.GOOS}}-{{.GOARCH}}'
      STAGE: '{{.ROOT}}/dist/stage/{{.GOOS}}-{{.GOARCH}}'
    deps: [build:web]
    cmds:
      - go -C tools run ./cmd/fetchtools -manifest "{{.ROOT}}/tools/manifest.json" -bin "{{.STAGE}}/tools" -platform {{.GOOS}}/{{.GOARCH}} livekit-server
      - >-
        GOOS={{.GOOS}} GOARCH={{.GOARCH}} CGO_ENABLED=0 go -C hub build -trimpath
        -ldflags "-s -w -X github.com/tornellihenrique/dislackso-rebirth/hub/internal/buildinfo.version={{.VERSION}}"
        -o "{{.STAGE}}/hub{{.EXE}}" ./cmd/hub
      - >-
        go -C tools run ./cmd/pack -o "{{.ROOT}}/dist/{{.NAME}}{{if eq .GOOS "windows"}}.zip{{else}}.tar.gz{{end}}"
        -prefix "{{.NAME}}"
        "{{.STAGE}}/hub{{.EXE}}" "{{.STAGE}}/tools/livekit-server{{.EXE}}" "{{.ROOT}}/release/README.txt"

  e2e:
    desc: Build the hub and run the Playwright suite against it
    deps: [build]
    cmds:
      - pnpm --filter @dislackso/e2e exec playwright install chromium
      - pnpm --filter @dislackso/e2e e2e

  e2e:desktop:
    desc: The desktop app against a fresh hub (Windows; it captures and draws on this machine's screen)
    deps: [build]
    cmds:
      - pnpm --filter @dislackso/e2e exec playwright install chromium
      - pnpm --filter @dislackso/e2e exec playwright test -c playwright.desktop.config.ts

  bench:share:
    desc: Measure screen share codecs and layers (writes e2e/bench-results/); takes ~10 minutes
    deps: [build]
    cmds:
      - pnpm --filter @dislackso/e2e exec playwright install chromium
      - pnpm --filter @dislackso/e2e exec playwright test -c playwright.bench.config.ts
