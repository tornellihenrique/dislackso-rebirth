version: '2'

run:
  tests: true

linters:
  default: standard
  enable:
    - bodyclose
    - contextcheck
    - copyloopvar
    - errname
    - errorlint
    - exhaustive
    - gocritic
    - gosec
    - intrange
    - misspell
    - modernize
    - nilerr
    - noctx
    - nolintlint
    - perfsprint
    - revive
    - sloglint
    - unconvert
    - unparam
    - usestdlibvars
    - wastedassign
  settings:
    exhaustive:
      default-signifies-exhaustive: true
    gocritic:
      enabled-tags: [diagnostic, performance, style]
      disabled-checks:
        - hugeParam
        - unnamedResult
        - whyNoLint
    nolintlint:
      require-explanation: true
      require-specific: true
    sloglint:
      no-mixed-args: true
      kv-only: false
      attr-only: false
      context: scope
  exclusions:
    generated: strict
    presets:
      - comments
      - std-error-handling
      - common-false-positives
    paths:
      - hub/gen
    rules:
      - path: _test\.go
        linters: [gosec, noctx]

formatters:
  enable:
    - gofumpt
    - goimports
  settings:
    gofumpt:
      extra:
        group-params: true
    goimports:
      local-prefixes:
        - github.com/tornellihenrique/dislackso-rebirth
  exclusions:
    generated: strict
    paths:
      - hub/gen
