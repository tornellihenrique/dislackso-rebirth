syntax = "proto3";

package dislackso.v1;

import "dislackso/v1/common.proto";

// AccountService manages the signed-in user's own account.
service AccountService {
  rpc GetMe(GetMeRequest) returns (GetMeResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }
  rpc UpdateProfile(UpdateProfileRequest) returns (UpdateProfileResponse);
  // Signs out every other session of the account.
  rpc ChangePassword(ChangePasswordRequest) returns (ChangePasswordResponse);
  rpc SetStatusPreference(SetStatusPreferenceRequest) returns (SetStatusPreferenceResponse);
  rpc ListSessions(ListSessionsRequest) returns (ListSessionsResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }
  rpc RevokeSession(RevokeSessionRequest) returns (RevokeSessionResponse);
  rpc RevokeOtherSessions(RevokeOtherSessionsRequest) returns (RevokeOtherSessionsResponse);
  // Emails a confirmation link to the new address; the address changes when
  // the link is opened (AuthService.ConfirmEmailChange). Without email the
  // address changes at once.
  rpc RequestEmailChange(RequestEmailChangeRequest) returns (RequestEmailChangeResponse);
  // Deletes the account for good. Servers the user owns must be transferred
  // or deleted first.
  rpc DeleteAccount(DeleteAccountRequest) returns (DeleteAccountResponse);
}

message GetMeRequest {}

message GetMeResponse {
  Me me = 1;
}

// Unset fields keep their value.
message UpdateProfileRequest {
  optional string display_name = 1;
  // A file uploaded with purpose "avatar"; empty removes the avatar.
  optional string avatar_file_id = 2;
}

message UpdateProfileResponse {
  Me me = 1;
}

message ChangePasswordRequest {
  string current_password = 1;
  string new_password = 2;
}

message ChangePasswordResponse {}

message SetStatusPreferenceRequest {
  StatusPreference status = 1;
  string custom_status = 2;
}

message SetStatusPreferenceResponse {
  Me me = 1;
}

message Session {
  string id = 1;
  // Unix ms.
  int64 created_at = 2;
  // Unix ms.
  int64 last_seen_at = 3;
  string user_agent = 4;
  string ip = 5;
  // True for the session making this request.
  bool current = 6;
}

message ListSessionsRequest {}

message ListSessionsResponse {
  repeated Session sessions = 1;
}

message RevokeSessionRequest {
  string session_id = 1;
}

message RevokeSessionResponse {}

message RevokeOtherSessionsRequest {}

message RevokeOtherSessionsResponse {
  int32 revoked = 1;
}

message RequestEmailChangeRequest {
  string new_email = 1;
  string password = 2;
}

message RequestEmailChangeResponse {
  // True when a confirmation email went out; false when the address changed
  // at once (no email configured).
  bool confirmation_sent = 1;
  Me me = 2;
}

message DeleteAccountRequest {
  string password = 1;
}

message DeleteAccountResponse {}
